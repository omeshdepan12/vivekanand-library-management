{% extends 'base.html' %}

{% block title %}Admin Payments{% endblock %}

{% block content %}
<section class="panel">
  <h2>Payment Records</h2>
  <table>
    <thead>
      <tr>
        <th>Student</th>
        <th>Amount</th>
        <th>Due Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for payment in payments %}
      <tr>
        <td>{{ payment.student_id }}</td>
        <td>₹{{ payment.amount }}</td>
        <td>{{ payment.due_date }}</td>
        <td>{{ payment.status }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
