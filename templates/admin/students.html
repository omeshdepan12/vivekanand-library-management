{% extends 'base.html' %}

{% block title %}Seat Management{% endblock %}

{% block content %}
<section class="panel">
  <h2>Seat Management</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Seat</th>
          <th>Status</th>
          <th>Student</th>
        </tr>
      </thead>
      <tbody>
        {% for seat in seats %}
        <tr>
          <td>{{ seat.seat_number }}</td>
          <td>{{ seat.status }}</td>
          <td>{{ seat.student_id if seat.student_id else 'Available' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
