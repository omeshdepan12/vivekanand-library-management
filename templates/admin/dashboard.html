{% extends 'base.html' %}

{% block title %}Verify OTP | Library{% endblock %}

{% block content %}
<section class="form-card small-card">
  <h2>Verify OTP</h2>
  <p class="demo-otp-box">Demo OTP: <strong>{{ otp_value }}</strong></p>
  <p class="muted">Target: {{ target }}</p>

  <form method="post">
    <div class="field">
      <label>Enter OTP</label>
      <input type="text" name="otp" maxlength="6" required>
    </div>
    <button type="submit" class="btn primary full-width">Verify & Login</button>
  </form>
</section>
{% endblock %}
