{% extends 'base.html' %}

{% block title %}Leave Library{% endblock %}

{% block content %}
<section class="panel">
  <h2>Leave Library</h2>
  <p class="muted">Leaving library will deactivate your account, cancel AutoPay, and release your seat for another student.</p>

  <form method="post" class="form-card small-card" style="margin: 0; max-width: 540px;">
    <div class="field">
      <label>Reason for leaving</label>
      <textarea name="reason" rows="4" placeholder="Optional reason"></textarea>
    </div>
    <button class="btn primary full-width" type="submit">Confirm Leave Request</button>
  </form>
</section>
{% endblock %}
