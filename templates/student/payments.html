{% extends 'base.html' %}

{% block title %}Audit Logs{% endblock %}

{% block content %}
<section class="panel">
  <h2>Audit Log</h2>
  <table>
    <thead>
      <tr>
        <th>Entity</th>
        <th>Action</th>
        <th>Details</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.entity }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.details }}</td>
        <td>{{ log.created_at }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
